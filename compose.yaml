services:
  ai-harness:
    build: .
    environment:
      AI_HARNESS_DATA_DIR: /data
      AI_HARNESS_MODEL_BASE_URL: ${AI_HARNESS_MODEL_BASE_URL:-https://api.openai.com/v1}
      AI_HARNESS_MODEL_API_KEY: ${AI_HARNESS_MODEL_API_KEY:?set AI_HARNESS_MODEL_API_KEY}
      AI_HARNESS_MODEL: ${AI_HARNESS_MODEL:-gpt-4.1-mini}
      AI_HARNESS_EMBEDDING_BASE_URL: ${AI_HARNESS_EMBEDDING_BASE_URL:-}
      AI_HARNESS_EMBEDDING_API_KEY: ${AI_HARNESS_EMBEDDING_API_KEY:-}
      AI_HARNESS_EMBEDDING_MODEL: ${AI_HARNESS_EMBEDDING_MODEL:-}
      AI_HARNESS_LSP_COMMAND: ${AI_HARNESS_LSP_COMMAND:-}
      AI_HARNESS_RESTRICTED_REACT_ENABLED: ${AI_HARNESS_RESTRICTED_REACT_ENABLED:-false}
      AI_HARNESS_RESTRICTED_REACT_MAX_TOOL_CALLS: ${AI_HARNESS_RESTRICTED_REACT_MAX_TOOL_CALLS:-3}
      AI_HARNESS_MCP_CATALOG_PATH: ${AI_HARNESS_MCP_CATALOG_PATH:-}
      AI_HARNESS_TENANT_ID: ${AI_HARNESS_TENANT_ID:-local}
      AI_HARNESS_AUTH_ENABLED: ${AI_HARNESS_AUTH_ENABLED:-false}
      AI_HARNESS_AUTH_CONFIG_PATH: /run/secrets/ai-harness-governance.json
      AI_HARNESS_GOVERNANCE_DATABASE_URL: postgresql://harness:${POSTGRES_PASSWORD:-harness-dev}@postgres:5432/ai_harness
      AI_HARNESS_REDIS_URL: redis://redis:6379/0
      AI_HARNESS_REDIS_KEY_PREFIX: ${AI_HARNESS_REDIS_KEY_PREFIX:-ai-harness}
      AI_HARNESS_REDIS_QUOTA_TTL_SECONDS: ${AI_HARNESS_REDIS_QUOTA_TTL_SECONDS:-259200}
      AI_HARNESS_REDIS_BINDING_CACHE_SECONDS: ${AI_HARNESS_REDIS_BINDING_CACHE_SECONDS:-300}
      AI_HARNESS_JOB_WORKERS: ${AI_HARNESS_JOB_WORKERS:-2}
      AI_HARNESS_JOB_POLL_INTERVAL_SECONDS: ${AI_HARNESS_JOB_POLL_INTERVAL_SECONDS:-0.2}
      AI_HARNESS_JOB_LEASE_SECONDS: ${AI_HARNESS_JOB_LEASE_SECONDS:-300}
      AI_HARNESS_JOB_QUEUE_CAPACITY: ${AI_HARNESS_JOB_QUEUE_CAPACITY:-100}
      AI_HARNESS_JOB_TIMEOUT_SECONDS: ${AI_HARNESS_JOB_TIMEOUT_SECONDS:-1800}
      AI_HARNESS_CIRCUIT_FAILURE_THRESHOLD: ${AI_HARNESS_CIRCUIT_FAILURE_THRESHOLD:-3}
      AI_HARNESS_CIRCUIT_RECOVERY_SECONDS: ${AI_HARNESS_CIRCUIT_RECOVERY_SECONDS:-30}
      AI_HARNESS_SANDBOX_MODE: local
    ports:
      - "8080:8080"
    volumes:
      - harness-data:/data
      - ${AI_HARNESS_REPOSITORY:-.}:/repository:ro
      - ${AI_HARNESS_AUTH_CONFIG_HOST_PATH:-./config/governance.example.json}:/run/secrets/ai-harness-governance.json:ro
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_harness
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-harness-dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness -d ai_harness"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true

  console:
    build: ./frontend
    depends_on:
      - ai-harness
    ports:
      - "5173:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=4m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE

volumes:
  harness-data:
  postgres-data:
  redis-data:
