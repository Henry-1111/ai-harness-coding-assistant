services:
  ai-harness:
    build: .
    environment:
      AI_HARNESS_DATA_DIR: /data
      AI_HARNESS_MODEL_BASE_URL: ${AI_HARNESS_MODEL_BASE_URL:-https://api.openai.com/v1}
      AI_HARNESS_MODEL_API_KEY: ${AI_HARNESS_MODEL_API_KEY:?set AI_HARNESS_MODEL_API_KEY}
      AI_HARNESS_MODEL: ${AI_HARNESS_MODEL:-gpt-4.1-mini}
      AI_HARNESS_EMBEDDING_BASE_URL: ${AI_HARNESS_EMBEDDING_BASE_URL:-}
      AI_HARNESS_EMBEDDING_API_KEY: ${AI_HARNESS_EMBEDDING_API_KEY:-}
      AI_HARNESS_EMBEDDING_MODEL: ${AI_HARNESS_EMBEDDING_MODEL:-}
      AI_HARNESS_LSP_COMMAND: ${AI_HARNESS_LSP_COMMAND:-}
      AI_HARNESS_RESTRICTED_REACT_ENABLED: ${AI_HARNESS_RESTRICTED_REACT_ENABLED:-false}
      AI_HARNESS_RESTRICTED_REACT_MAX_TOOL_CALLS: ${AI_HARNESS_RESTRICTED_REACT_MAX_TOOL_CALLS:-3}
      AI_HARNESS_MCP_CATALOG_PATH: ${AI_HARNESS_MCP_CATALOG_PATH:-}
      AI_HARNESS_TENANT_ID: ${AI_HARNESS_TENANT_ID:-local}
      AI_HARNESS_AUTH_ENABLED: ${AI_HARNESS_AUTH_ENABLED:-false}
      AI_HARNESS_AUTH_CONFIG_PATH: /run/secrets/ai-harness-governance.json
      AI_HARNESS_GOVERNANCE_DATABASE_URL: postgresql://harness:${POSTGRES_PASSWORD:-harness-dev}@postgres:5432/ai_harness
      AI_HARNESS_REDIS_URL: redis://redis:6379/0
      AI_HARNESS_REDIS_KEY_PREFIX: ${AI_HARNESS_REDIS_KEY_PREFIX:-ai-harness}
      AI_HARNESS_REDIS_QUOTA_TTL_SECONDS: ${AI_HARNESS_REDIS_QUOTA_TTL_SECONDS:-259200}
      AI_HARNESS_REDIS_BINDING_CACHE_SECONDS: ${AI_HARNESS_REDIS_BINDING_CACHE_SECONDS:-300}
      AI_HARNESS_JOB_WORKERS: ${AI_HARNESS_JOB_WORKERS:-2}
      AI_HARNESS_JOB_POLL_INTERVAL_SECONDS: ${AI_HARNESS_JOB_POLL_INTERVAL_SECONDS:-0.2}
      AI_HARNESS_JOB_LEASE_SECONDS: ${AI_HARNESS_JOB_LEASE_SECONDS:-300}
      AI_HARNESS_JOB_QUEUE_CAPACITY: ${AI_HARNESS_JOB_QUEUE_CAPACITY:-100}
      AI_HARNESS_JOB_TIMEOUT_SECONDS: ${AI_HARNESS_JOB_TIMEOUT_SECONDS:-1800}
      AI_HARNESS_CIRCUIT_FAILURE_THRESHOLD: ${AI_HARNESS_CIRCUIT_FAILURE_THRESHOLD:-3}
      AI_HARNESS_CIRCUIT_RECOVERY_SECONDS: ${AI_HARNESS_CIRCUIT_RECOVERY_SECONDS:-30}
      AI_HARNESS_QUOTA_RECONCILIATION_INTERVAL_SECONDS: ${AI_HARNESS_QUOTA_RECONCILIATION_INTERVAL_SECONDS:-30}
      AI_HARNESS_CORS_ALLOWED_ORIGINS: ${AI_HARNESS_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      AI_HARNESS_WORKSPACE_SNAPSHOT_DIR: /data/workspace-snapshots
      AI_HARNESS_WORKSPACE_SNAPSHOT_MAX_BYTES: ${AI_HARNESS_WORKSPACE_SNAPSHOT_MAX_BYTES:-10737418240}
      AI_HARNESS_WORKSPACE_SNAPSHOT_S3_BUCKET: ${AI_HARNESS_WORKSPACE_SNAPSHOT_S3_BUCKET:-}
      AI_HARNESS_WORKSPACE_SNAPSHOT_S3_PREFIX: ${AI_HARNESS_WORKSPACE_SNAPSHOT_S3_PREFIX:-ai-harness/workspaces}
      AI_HARNESS_WORKSPACE_SNAPSHOT_S3_ENDPOINT: ${AI_HARNESS_WORKSPACE_SNAPSHOT_S3_ENDPOINT:-}
      AI_HARNESS_WORKSPACE_SNAPSHOT_S3_REGION: ${AI_HARNESS_WORKSPACE_SNAPSHOT_S3_REGION:-}
      AI_HARNESS_WORKSPACE_SNAPSHOT_S3_ACCESS_KEY_ID: ${AI_HARNESS_WORKSPACE_SNAPSHOT_S3_ACCESS_KEY_ID:-}
      AI_HARNESS_WORKSPACE_SNAPSHOT_S3_SECRET_ACCESS_KEY: ${AI_HARNESS_WORKSPACE_SNAPSHOT_S3_SECRET_ACCESS_KEY:-}
      AI_HARNESS_PROMOTION_MODE: ${AI_HARNESS_PROMOTION_MODE:-local}
      AI_HARNESS_PROMOTION_GIT_REMOTE_URL: ${AI_HARNESS_PROMOTION_GIT_REMOTE_URL:-}
      AI_HARNESS_PROMOTION_GIT_BASE_REF: ${AI_HARNESS_PROMOTION_GIT_BASE_REF:-main}
      AI_HARNESS_PROMOTION_GIT_BRANCH_PREFIX: ${AI_HARNESS_PROMOTION_GIT_BRANCH_PREFIX:-ai-harness}
      AI_HARNESS_PROMOTION_GIT_AUTHOR_NAME: ${AI_HARNESS_PROMOTION_GIT_AUTHOR_NAME:-AI Harness}
      AI_HARNESS_PROMOTION_GIT_AUTHOR_EMAIL: ${AI_HARNESS_PROMOTION_GIT_AUTHOR_EMAIL:-ai-harness@localhost}
      AI_HARNESS_SANDBOX_MODE: local
    ports:
      - "8080:8080"
    volumes:
      - harness-data:/data
      - ${AI_HARNESS_REPOSITORY:-.}:/repository:ro
      - ${AI_HARNESS_AUTH_CONFIG_HOST_PATH:-./config/governance.example.json}:/run/secrets/ai-harness-governance.json:ro
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=3).read()"
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_harness
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-harness-dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness -d ai_harness"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true

  console:
    build: ./frontend
    depends_on:
      ai-harness:
        condition: service_healthy
    ports:
      - "5173:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=4m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    depends_on:
      ai-harness:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:11.6.0
    profiles: ["monitoring"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    tmpfs:
      - /tmp:size=64m
    depends_on:
      - prometheus
    read_only: true
    security_opt:
      - no-new-privileges:true

volumes:
  harness-data:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
