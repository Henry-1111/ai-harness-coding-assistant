[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-harness"
version = "0.1.0"
description = "A safe multi-agent coding harness with repository search, plan DAGs, sandboxed execution and resumable checkpoints."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.110,<1",
  "httpx>=0.27,<1",
  "langgraph>=0.2,<2",
  "PyJWT[crypto]>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.7,<3",
  "redis>=6,<8",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6,<1"]
lsp = ["pyright>=1.1.414,<2"]

[project.scripts]
ai-harness = "ai_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

